<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productivity Analytics</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/analytics.css">

</head>


<body>


<div class="analytics-container">


<h1>📊 Productivity Analytics</h1>

<p>Track your study progress and task performance.</p>



<div class="stats">


<div class="box">

<h3>Total Tasks</h3>

<h2 id="total">0</h2>

</div>



<div class="box">

<h3>Completed</h3>

<h2 id="completed">0</h2>

</div>



<div class="box">

<h3>Productivity Score</h3>

<h2 id="score">0%</h2>

</div>


</div>





<div class="chart-box">


<h2>Weekly Progress</h2>


<div class="chart">


<div class="bar" id="mon">
<span>Mon</span>
</div>


<div class="bar" id="tue">
<span>Tue</span>
</div>


<div class="bar" id="wed">
<span>Wed</span>
</div>


<div class="bar" id="thu">
<span>Thu</span>
</div>


<div class="bar" id="fri">
<span>Fri</span>
</div>


<div class="bar" id="sat">
<span>Sat</span>
</div>


<div class="bar" id="sun">
<span>Sun</span>
</div>


</div>


</div>




<a href="index.html">
← Back to Planner
</a>


</div>



<script src="js/analytics.js"></script>


</body>

</html>
